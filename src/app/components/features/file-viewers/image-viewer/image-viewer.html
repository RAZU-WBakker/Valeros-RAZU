<div class="carousel w-full relative h-[70vh] viewer-stage">
    @for (item of (imageUrls); track $index) {
    <div id="slide{{ $index + 1 }}" class="carousel-item relative w-full h-full"
        [class.hidden]="$index !== currentIndex">
        <img [src]="getDisplayUrl(item)" [alt]="imageLabel ?? 'image'" class="mx-auto h-full w-auto object-contain" />
        @if (imageUrls.length > 1) {
        <div class="absolute left-5 right-5 top-1/2 flex -translate-y-1/2 transform justify-between">
            <button type="button" class="btn btn-circle" (click)="prev()" aria-label="Previous image">❮</button>
            <button type="button" class="btn btn-circle" (click)="next()" aria-label="Next image">❯</button>
        </div>
        }
    </div>
    }
</div>

<!-- Thumbnails strip -->
@if (imageUrls.length > 1) {
<div class="w-full bg-base-200/80 viewer-thumbs">
    <div class="flex items-center gap-2 overflow-x-auto p-2">
        @for (thumb of (imageUrls); track $index) {
        <button type="button"
            class="shrink-0 rounded border border-base-300 hover:border-primary focus:outline-none focus:ring-2 focus:ring-primary"
            [class.ring-2]="$index === currentIndex" [class.ring-primary]="$index === currentIndex"
            (click)="select($index)" [attr.aria-label]="'Show image ' + ($index + 1)">
            <div class="w-20 h-16 bg-base-100 flex items-center justify-center rounded">
                <img [src]="getThumbUrl(thumb)" class="max-h-16 max-w-20 object-contain"
                    [alt]="(imageLabel ?? 'thumbnail') + ' ' + ($index + 1)" />
            </div>
        </button>
        }
    </div>
</div>
}
