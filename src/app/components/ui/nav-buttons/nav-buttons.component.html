    <ng-template #desktopGrid>

        </div>
        <div class="navbar-center hidden lg:flex">
          <ul class="menu menu-horizontal px-1">
            <ng-container *ngFor="let btn of topButtons">
              <li>
                <a class="tooltip tooltip-top btn btn-ghost btn-lg flex flex-col gap-0"
                  routerLinkActive="btn-active bg-primary text-primary-content" #rla="routerLinkActive"

                  [queryParams]="isRouteObject(btn.route) ? btn.route.queryParams : null">
                  <ng-icon [svg]="btn.icon" class="text-sm pb-2" aria-hidden="true"></ng-icon>
                  <span class="text-[0.9rem]  leading-none hidden sm:block">{{ btn.label }}</span>
                </a>
              </li>
            </ng-container>
            <img *ngIf="settings.showLogo" [src]="settings.logoPath" alt="Logo" [class.mr-3]="settings.showTitle"

            </ng-container>

          </ul>
        </div>

  <ng-template #tabs>
    <!-- DaisyUI Dock replacing custom bottom tabs/menu -->
    <div
      class="hidden min-[1100px]:flex dock dock-bottom dock-xl fixed bottom-0 left-0 right-0 w-full z-50 bg-base-100/90 backdrop-blur shadow-lg items-stretch"
      role="toolbar" aria-label="Navigation">
      <!-- Top buttons -->
      <ng-container *ngFor="let btn of topButtons">
        <a class="dock-item dock-active tooltip tooltip-top btn btn-ghost btn-lg flex flex-col gap-0"
          routerLinkActive="btn-active bg-primary text-primary-content" #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }" [attr.data-tip]="btn.label" [attr.aria-label]="btn.label"
          [attr.aria-current]="rla.isActive ? 'page' : null" (click)="debugRoute(btn)"
          [routerLink]="isRouteObject(btn.route) ? [btn.route.path] : [btn.route]"
          [queryParams]="isRouteObject(btn.route) ? btn.route.queryParams : null">
          <ng-icon [svg]="btn.icon" class="text-xl" aria-hidden="true"></ng-icon>
          <span class="text-[0.9rem] leading-none hidden sm:block">{{ btn.label }}</span>
        </a>
      </ng-container>
      <!-- Middle buttons -->
      <ng-container *ngFor="let btn of middleButtons">
        <a class="dock-item dock-active tooltip tooltip-top btn btn-ghost btn-lg flex flex-col gap-0"
          routerLinkActive="btn-active bg-primary text-primary-content" #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }" [attr.data-tip]="btn.label" [attr.aria-label]="btn.label"
          [attr.aria-current]="rla.isActive ? 'page' : null" (click)="debugRoute(btn)"
          [routerLink]="isRouteObject(btn.route) ? [btn.route.path] : [btn.route]"
          [queryParams]="isRouteObject(btn.route) ? btn.route.queryParams : null">
          <ng-icon [svg]="btn.icon" class="text-xl" aria-hidden="true"></ng-icon>
          <span class="text-[0.9rem] leading-none">{{ btn.label }}</span>
        </a>
      </ng-container>
      <!-- Bottom buttons -->
      <ng-container *ngFor="let btn of bottomButtons">
        <a class="dock-item dock-active tooltip tooltip-top btn btn-ghost btn-lg flex flex-col gap-0"
          routerLinkActive="btn-active bg-primary text-primary-content" #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }" [attr.data-tip]="btn.label" [attr.aria-label]="btn.label"
          [attr.aria-current]="rla.isActive ? 'page' : null" (click)="debugRoute(btn)"
          [routerLink]="isRouteObject(btn.route) ? [btn.route.path] : [btn.route]"
          [queryParams]="isRouteObject(btn.route) ? btn.route.queryParams : null">
          <ng-icon [svg]="btn.icon" class="text-xl" aria-hidden="true"></ng-icon>
          <span class="text-[0.9rem] leading-none">{{ btn.label }}</span>
        </a>
      </ng-container>
    </div>
  </ng-template>
  <button type="button"
    class="btn btn-primary btn-circle fixed bottom-4 right-4 z-[10001] min-[1100px]:hidden shadow-lg interactive"
    aria-label="Open menu" [attr.aria-expanded]="menuOpen" aria-controls="nav-overlay-menu" (click)="toggleMenu()">
    <div class="tooltip tooltip-open" data-tip="Menu"><span class="text-xl" aria-hidden="true">☰</span></div>
  </button>
  <div class="fixed inset-0 bg-base-300/60 backdrop-blur z-[10000] min-[1100px]:hidden interactive"
    [class.hidden]="!menuOpen" (click)="closeMenu()"></div>
  <div id="nav-overlay-menu" role="dialog" aria-modal="true"
    class="fixed bottom-4 right-4 left-4 sm:left-auto sm:w-80 bg-base-100 rounded-box shadow-xl border border-base-300 p-3 z-[10002] min-[1100px]:hidden interactive"
    [class.hidden]="!menuOpen" [attr.aria-hidden]="!menuOpen" (click)="$event.stopPropagation()">
    <div class="flex items-center justify-between mb-2">
      <span class="font-semibold">Menu</span>
      <button type="button" class="btn btn-ghost btn-sm" (click)="closeMenu()" aria-label="Close menu">✖</button>
    </div>
    <ul class="menu w-full">
      <li class="menu-title">{{ 'hemiw-theme.discover_stories' | translate }}</li>
      <li *ngFor="let btn of topButtons">
        <a routerLinkActive="active bg-primary text-primary-content" #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }" (click)="debugRoute(btn); closeMenu()"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [routerLink]="isRouteObject(btn.route) ? [btn.route.path] : [btn.route]"
          [queryParams]="isRouteObject(btn.route) ? btn.route.queryParams : null">
          <ng-icon [svg]="btn.icon" class="mr-2" aria-hidden="true"></ng-icon>
          {{ btn.label }}
        </a>
      </li>
      <li class="menu-title mt-2">{{ 'hemiw-theme.explore_data' | translate }}</li>
      <li *ngFor="let btn of middleButtons">
        <a routerLinkActive="active bg-primary text-primary-content" #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }" (click)="debugRoute(btn); closeMenu()"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [routerLink]="isRouteObject(btn.route) ? [btn.route.path] : [btn.route]"
          [queryParams]="isRouteObject(btn.route) ? btn.route.queryParams : null">
          <ng-icon [svg]="btn.icon" class="mr-2" aria-hidden="true"></ng-icon>
          {{ btn.label }}
        </a>
      </li>
      <li class="menu-title mt-2">&nbsp;</li>
      <li *ngFor="let btn of bottomButtons">
        <a routerLinkActive="active bg-primary text-primary-content" #rla="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }" (click)="debugRoute(btn); closeMenu()"
          [attr.aria-current]="rla.isActive ? 'page' : null"
          [routerLink]="isRouteObject(btn.route) ? [btn.route.path] : [btn.route]"
          [queryParams]="isRouteObject(btn.route) ? btn.route.queryParams : null">
          <ng-icon [svg]="btn.icon" class="mr-2" aria-hidden="true"></ng-icon>
          {{ btn.label }}
        </a>
      </li>
    </ul>
  </div>
</div>
